<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Attributes')}"><title>Dataset Generator</title></head>
<body>

<div th:replace="~{fragments/navbar :: nav}"></div>

<div class="container">

    <h2 class="mb-3">Attributes</h2>

    <!-- Formulaire -->
    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/attributes/saveAttribute}" th:object="${attribute}" method="post">

                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Attribute name</label>
                        <label>
                            <input class="form-control" th:field="*{name}" required/>
                        </label>
                    </div>

                    <div class="col">
                        <label class="form-label">Type</label>
                        <label>
                            <select class="form-select" th:field="*{type}">
                                <option value="STRING">STRING</option>
                                <option value="INTEGER">INTEGER</option>
                                <option value="DOUBLE">DOUBLE</option>
                                <option value="BOOLEAN">BOOLEAN</option>
                                <option value="DATE">DATE</option>
                            </select>
                        </label>
                    </div>

                    <div class="col">
                        <label class="form-label">Entity</label>
                        <select class="form-select" th:field="*{entityModel.entity_id}">
                            <option th:each="e : ${entities}"
                                    th:value="${e.entity_id}"
                                    th:text="${e.name}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Min</label>
                        <label>
                            <input type="number" class="form-control" th:field="*{min}"/>
                        </label>
                    </div>
                    <div class="col">
                        <label class="form-label">Max</label>
                        <label>
                            <input type="number" class="form-control" th:field="*{max}"/>
                        </label>
                    </div>
                    <div class="col">
                        <label class="form-label">Length</label>
                        <label>
                            <input type="number" class="form-control" th:field="*{length}"/>
                        </label>
                    </div>
                </div>

                <button class="btn btn-primary">Save Attribute</button>
            </form>
        </div>
    </div>

    <!-- Table -->
    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Type</th>
            <th>Entity</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${attributes}">
            <td th:text="${a.attribute_id}"></td>
            <td th:text="${a.name}"></td>
            <td th:text="${a.type}"></td>
            <td th:text="${a.entityModel.name}"></td>
            <td>
                <a class="btn btn-sm btn-secondary"
                   th:href="@{'/attributes/edit/' + ${a.attribute_id}}">
                    Edit
                </a>

                <a class="btn btn-sm btn-danger"
                   th:href="@{'/attributes/delete/' + ${a.attribute_id}}"
                   onclick="return confirm('Delete attribute?');">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
