version: "3.9"

services:
  discovery-server:
    build:
      context: ./eureka-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_APPLICATION_NAME=discovery-server
      - SERVER_PORT=8761
      # Si ton Eureka est bien dans microservices
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - EUREKA_INSTANCE_HOSTNAME=discovery-server
    networks:
      - dataset-net

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_APPLICATION_NAME=api-gateway
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    depends_on:
      - discovery-server
    networks:
      - dataset-net

  dataset-manager-service:
    build:
      context: ./dataset-manager-service
    container_name: dataset-manager-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_APPLICATION_NAME=dataset-manager-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true

      # H2 en fichier dans un volume docker (persistance)
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/myH2Database;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      - SPRING_DATASOURCE_DRIVERCLASSNAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    volumes:
      - dataset-manager-data:/data
    depends_on:
      - discovery-server
    networks:
      - dataset-net

  generator-service:
    build:
      context: ./generator-service
    container_name: generator-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_APPLICATION_NAME=generator-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    depends_on:
      - discovery-server
    networks:
      - dataset-net

networks:
  dataset-net:

volumes:
  dataset-manager-data:
